name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: dotnet publish EssenCrawler.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ steps.version.outputs.version }} -o publish_output

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path publish_output\* -DestinationPath EssenCrawler-win-x64.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: EssenCrawler-win-x64.zip
          generate_release_notes: true
